name: RGB webcam model smoke

on:
  pull_request:
    paths:
      - 'src/rgb_checkpoint_predictor.py'
      - 'experiments/rgb_verified_live.py'
      - 'experiments/rgb_transfer_eval.py'
      - 'tests/test_rgb_checkpoint_predictor.py'
      - '.github/workflows/rgb-webcam-model.yml'
  push:
    paths:
      - 'src/rgb_checkpoint_predictor.py'
      - 'experiments/rgb_verified_live.py'
      - 'experiments/rgb_transfer_eval.py'
      - 'tests/test_rgb_checkpoint_predictor.py'
      - '.github/workflows/rgb-webcam-model.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal CPU JAX
        run: python -m pip install 'jax==0.9.0.1' 'numpy==2.3.5'
      - name: Check actual frozen-model inference adapters
        run: python -m unittest tests.test_rgb_checkpoint_predictor tests.test_rgb_transfer_eval -v
