# Example only: publish an image first; replace the tag with an immutable digest.
# Public HTTP serves SYNTHETIC artifacts after training. Never put private data here.
version: "2.0"
services:
  trainer:
    image: ghcr.io/walmsley-lab/ml-innovation-18-predictive-mirror:bootstrap-1
    env:
      - RUN_MODE=train # safe default: tiny single training job
      - CAMPAIGN_APPROVED=0 # must be changed manually for RUN_MODE=campaign
      - CAMPAIGN_MAX_RUNS=1 # must explicitly cover planned experiment count
      - LOSS_MODE=plain # compare with contrast after the initial GPU smoke # choose sweep for an experiment matrix
      - CHECKPOINT_EVERY=25
      - RESUME=0 # change to 1 only when same container still has prior checkpoints
      - SEED=42
      - STEPS=120
      - BATCH_SIZE=8
      - REQUIRE_GPU=1
    expose:
      - port: 8080
        to:
          - global: true
profiles:
  compute:
    trainer:
      resources:
        cpu:
          units: 4
        memory:
          size: 12Gi
        storage:
          size: 8Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: rtx3090
  placement:
    akash:
      pricing:
        trainer:
          denom: uact
          amount: 2500 # MAXIMUM BID per block (~$1.50/hr); review real quotes.
deployment:
  trainer:
    akash:
      profile: trainer
      count: 1
